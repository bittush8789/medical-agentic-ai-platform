apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: medguide-hpa
  namespace: medguide-prod
  labels:
    app: medguide-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: medguide-app
  minReplicas: 5
  maxReplicas: 50
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
      selectPolicy: Min
