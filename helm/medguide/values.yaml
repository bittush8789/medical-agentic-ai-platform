# ==============================================================================
# MedGuide AI — Production Helm Chart Default Values
# ==============================================================================

replicaCount: 5

image:
  repository: 123456789012.dkr.ecr.us-east-1.amazonaws.com/medguide-ai-platform
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: "medguide"

serviceAccount:
  create: true
  annotations:
    # Associate IAM Role for Service Accounts (IRSA)
    eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/production-medguide-app-role"
  name: "medguide-sa"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: "alb"
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /api/health
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=120
  hosts:
    - host: ai.yourmedicaldomain.com
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "2000m"
    memory: "2Gi"

autoscaling:
  enabled: true
  minReplicas: 5
  maxReplicas: 50
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75

env:
  CHAT_MODEL: "gemini/gemini-2.5-flash"
  FALLBACK_MODELS: "claude-3-5-sonnet-20241022,gpt-4.1-mini,gemini/gemini-2.0-flash"
  MAX_FALLBACK_RETRIES: "3"
  GATEWAY_TIMEOUT: "45"
  PINECONE_INDEX: "medical-agent-demo"
  ENABLE_AUDIT_LOGGING: "true"
  ENABLE_GUARDRAILS: "true"
  ENABLE_PRESIDIO_PII: "true"
  ENABLE_NEMO_GUARDRAILS: "true"
  ENABLE_AGENT_GOVERNANCE: "true"
  MAX_TOOL_CALLS_PER_TURN: "6"
  RATE_LIMIT_RPM: "60"
  ENABLE_LANGMEM: "true"
  ENABLE_REDIS_CACHE: "true"
  ENABLE_AI_SECURITY: "true"
  ENABLE_INDIRECT_INJECTION_DEFENSE: "true"
  ENABLE_MEMORY_POISONING_DEFENSE: "true"
  ENABLE_EXFILTRATION_DEFENSE: "true"
  ALLOWED_ORIGINS: "*"
  LOG_LEVEL: "info"
  WEB_CONCURRENCY: "4"

# Secret name containing sensitive API keys and DATABASE_URL
existingSecret: "medguide-secrets"
