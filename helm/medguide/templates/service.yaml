apiVersion: v1
kind: Service
metadata:
  name: {{ include "medguide.fullname" . }}-service
  labels:
    {{- include "medguide.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "medguide.selectorLabels" . | nindent 4 }}
